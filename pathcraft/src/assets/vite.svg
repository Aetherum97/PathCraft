<svg width="100%" height="100%" viewBox="0 0 900 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Illustration portfolio développeur web et mobile</title>
  <desc id="desc">
    Illustration moderne avec écran de code, smartphone, composants web et éléments graphiques.
  </desc>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"></stop>
      <stop offset="1" stop-color="#1E293B"></stop>
    </linearGradient>

    <linearGradient id="accentGradient" x1="220" y1="120" x2="680" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"></stop>
      <stop offset="1" stop-color="#8B5CF6"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="36" fill="url(#bgGradient)"></rect>

  <!-- Decorative circles -->
  <circle cx="140" cy="120" r="70" fill="#38BDF8" opacity="0.12"></circle>
  <circle cx="760" cy="470" r="95" fill="#8B5CF6" opacity="0.14"></circle>
  <circle cx="720" cy="110" r="34" fill="#22C55E" opacity="0.18"></circle>

  <!-- Grid dots -->
  <g opacity="0.22" fill="#CBD5E1">
    <circle cx="90" cy="420" r="3"></circle>
    <circle cx="130" cy="420" r="3"></circle>
    <circle cx="170" cy="420" r="3"></circle>
    <circle cx="90" cy="460" r="3"></circle>
    <circle cx="130" cy="460" r="3"></circle>
    <circle cx="170" cy="460" r="3"></circle>
    <circle cx="90" cy="500" r="3"></circle>
    <circle cx="130" cy="500" r="3"></circle>
    <circle cx="170" cy="500" r="3"></circle>
  </g>

  <!-- Main monitor -->
  <g filter="url(#shadow)">
    <rect x="190" y="125" width="470" height="310" rx="24" fill="#020617"></rect>
    <rect x="210" y="155" width="430" height="245" rx="16" fill="#0F172A"></rect>
    
    <!-- Window top bar -->
    <rect x="210" y="155" width="430" height="42" rx="16" fill="#1E293B"></rect>
    <circle cx="237" cy="176" r="6" fill="#EF4444"></circle>
    <circle cx="260" cy="176" r="6" fill="#F59E0B"></circle>
    <circle cx="283" cy="176" r="6" fill="#22C55E"></circle>

    <!-- Code lines -->
    <rect x="240" y="225" width="95" height="10" rx="5" fill="#38BDF8"></rect>
    <rect x="350" y="225" width="170" height="10" rx="5" fill="#64748B"></rect>
    <rect x="240" y="255" width="145" height="10" rx="5" fill="#A78BFA"></rect>
    <rect x="405" y="255" width="85" height="10" rx="5" fill="#22C55E"></rect>
    <rect x="240" y="285" width="65" height="10" rx="5" fill="#F472B6"></rect>
    <rect x="325" y="285" width="220" height="10" rx="5" fill="#64748B"></rect>
    <rect x="240" y="315" width="185" height="10" rx="5" fill="#38BDF8"></rect>
    <rect x="445" y="315" width="80" height="10" rx="5" fill="#F59E0B"></rect>
    <rect x="240" y="345" width="120" height="10" rx="5" fill="#A78BFA"></rect>
    <rect x="380" y="345" width="190" height="10" rx="5" fill="#64748B"></rect>
  </g>

  <!-- Monitor stand -->
  <path d="M390 435H460L475 505H375L390 435Z" fill="#334155"></path>
  <rect x="325" y="500" width="200" height="24" rx="12" fill="#475569"></rect>

  <!-- Smartphone -->
  <g filter="url(#shadow)">
    <rect x="630" y="245" width="120" height="220" rx="26" fill="#020617"></rect>
    <rect x="642" y="275" width="96" height="155" rx="14" fill="#111827"></rect>
    <rect x="675" y="258" width="40" height="6" rx="3" fill="#475569"></rect>
    <circle cx="690" cy="446" r="8" fill="#334155"></circle>

    <!-- Mobile UI -->
    <rect x="657" y="296" width="66" height="12" rx="6" fill="url(#accentGradient)"></rect>
    <rect x="657" y="325" width="48" height="8" rx="4" fill="#64748B"></rect>
    <rect x="657" y="348" width="66" height="38" rx="9" fill="#1E293B"></rect>
    <rect x="666" y="361" width="48" height="6" rx="3" fill="#38BDF8"></rect>
    <rect x="666" y="374" width="34" height="6" rx="3" fill="#8B5CF6"></rect>
    <rect x="657" y="398" width="66" height="12" rx="6" fill="#22C55E" opacity="0.85"></rect>
  </g>

  <!-- Floating web cards -->
  <g filter="url(#shadow)">
    <rect x="105" y="230" width="120" height="95" rx="18" fill="#1E293B"></rect>
    <rect x="125" y="252" width="60" height="9" rx="4.5" fill="#38BDF8"></rect>
    <rect x="125" y="274" width="80" height="7" rx="3.5" fill="#64748B"></rect>
    <rect x="125" y="293" width="55" height="7" rx="3.5" fill="#64748B"></rect>
  </g>

  <!-- Brackets icon -->
  <g stroke="url(#accentGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 170L92 205L128 240"></path>
    <path d="M772 170L808 205L772 240"></path>
  </g>

  <!-- Slash -->
  <path d="M485 95L415 505" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.35"></path>

  <!-- Text -->
  <text x="450" y="555" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="28" font-weight="700">
    Web • Mobile • UI • Code
  </text>

  <!-- Small sparkles -->
  <g fill="#F8FAFC" opacity="0.85">
    <path d="M705 75L713 94L732 102L713 110L705 129L697 110L678 102L697 94L705 75Z"></path>
    <path d="M190 82L195 95L208 100L195 105L190 118L185 105L172 100L185 95L190 82Z"></path>
  </g>
</svg>