<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Illustration minimaliste développeur web et mobile</title>
  <desc id="desc">
    Un écran d'ordinateur et un smartphone avec des symboles de code, dans un style minimaliste.
  </desc>

  <defs>
    <linearGradient id="screenGradient" x1="310" y1="190" x2="830" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F2B5B"></stop>
      <stop offset="1" stop-color="#0B1E3E"></stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F8FAFC"></rect>

  <!-- Monitor -->
  <g filter="url(#shadow)">
    <rect x="290" y="170" width="560" height="340" rx="28" fill="#10254B"></rect>
    <rect x="310" y="190" width="520" height="255" rx="18" fill="url(#screenGradient)"></rect>
    <rect x="290" y="445" width="560" height="65" fill="#FFFFFF"></rect>
    <circle cx="570" cy="478" r="11" fill="#10254B"></circle>

    <!-- Stand -->
    <path d="M515 510H625L645 620H495L515 510Z" fill="#D7DEE9"></path>
    <rect x="460" y="620" width="220" height="24" rx="12" fill="#D7DEE9"></rect>
  </g>

  <!-- Code icon on monitor -->
  <g stroke="#1DA1F2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385 265L350 295L385 325"></path>
    <path d="M500 265L535 295L500 325"></path>
    <path d="M450 235L418 355"></path>
  </g>

  <!-- Code lines on monitor -->
  <g>
    <rect x="355" y="380" width="95" height="14" rx="7" fill="#1DA1F2"></rect>
    <rect x="470" y="380" width="125" height="14" rx="7" fill="#FFFFFF"></rect>
    <rect x="615" y="380" width="105" height="14" rx="7" fill="#4A6495"></rect>

    <rect x="355" y="430" width="140" height="14" rx="7" fill="#FFFFFF"></rect>
    <rect x="515" y="430" width="190" height="14" rx="7" fill="#1DA1F2"></rect>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="760" y="360" width="150" height="285" rx="28" fill="#10254B"></rect>
    <rect x="772" y="372" width="126" height="261" rx="22" fill="#FFFFFF"></rect>
    <path d="M808 372H862C866 372 869 375 869 379V384C869 392 862 398 854 398H816C808 398 801 392 801 384V379C801 375 804 372 808 372Z" fill="#10254B"></path>
  </g>

  <!-- Code icon on phone -->
  <g stroke="#1DA1F2" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M822 470L798 490L822 510"></path>
    <path d="M871 470L895 490L871 510"></path>
    <path d="M855 445L835 535"></path>
  </g>

  <!-- Code lines on phone -->
  <g>
    <rect x="802" y="565" width="52" height="12" rx="6" fill="#1DA1F2"></rect>
    <rect x="864" y="565" width="42" height="12" rx="6" fill="#D1D9E6"></rect>

    <rect x="802" y="598" width="76" height="12" rx="6" fill="#1DA1F2"></rect>
    <rect x="886" y="598" width="20" height="12" rx="6" fill="#D1D9E6"></rect>
  </g>
</svg>